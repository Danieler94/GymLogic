const KEY='gymlogic23';const USERS_KEY='gymlogic_users_v1';const SESSION_KEY='gymlogic_session_v1';let DB={bookmark:null,loads:{},completed:{},history:[],overrides:{},tests:{}};try{DB={...DB,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}

 let arr=PROGRAM[block-1]?.massimali||[],n=normName(name);

function testKg(block,name){
 let st=DB.tests&&DB.tests[block], key=st&&st.byName&&normName(name); if(key&&isFinite(Number(st.byName[key]))) return Number(st.byName[key]);

function home(){let b=DB.bookmark;let text=b?`Blocco ${b.block+1} · Settimana ${b.week} · Giorno ${b.day} · Esercizio ${b.exercise+1} · Serie ${b.set+1}`:'Nessun allenamento in corso';let done=DB.history.length;document.getElementById('app').innerHTML=`<section class="hero"><h1>${b?'Continua da dove hai lasciato':'Inizia il tuo percorso'}</h1><div class="muted">${text}</div><br><button class="btn" onclick="${b?'resume()':'startCurrent()'}">${b?'Continua allenamento':'Apri programma'}</button></section><div class="grid"><div class="card stat"><span class="muted tiny">Allenamenti registrati</span><strong>${done}</strong></div><div class="card stat"><span class="muted tiny">Esercizi nel programma</span><strong>${totalExercises()}</strong></div></div><div class="sectionTitle">Percorso annuale</div>${PROGRAM.map((x,i)=>{const ok=blockUnlocked(i),gen=DB.tests&&DB.tests[i+1]&&DB.tests[i+1].programGenerated;return `<div class="card"><div class="row"><div><b>Blocco ${i+1}</b><div class="muted tiny">${esc(x.name)}</div></div><span class="pill">${gen?'✓ Generato':ok?'Pronto':'Bloccato'}</span></div></div>`}).join('')}`}
function startCurrent(){selected={block:0,week:1,day:1,exercise:0};render('program')}
function resume(){let b=DB.bookmark;selected={block:b.block,week:b.week,day:b.day,exercise:b.exercise};render('workout')}
function ensureBlockTest(blockIndex){return !!(DB.tests&&DB.tests[blockIndex+1]&&DB.tests[blockIndex+1].__complete)}
function blockUnlocked(i){
 if(i===0)return true;
 return !!(DB.blocksCompleted&&DB.blocksCompleted[i-1]&&DB.tests&&DB.tests[i]&&DB.tests[i].__complete&&DB.tests[i].programGenerated);
}
function program(){
 let b=block(),w=week();
 if(!blockUnlocked(selected.block)){
   const prev=selected.block-1;
   document.getElementById('app').innerHTML=`<div class="hero"><h1>Blocco ${selected.block+1} non ancora disponibile</h1><div class="muted">Completa prima il Blocco ${selected.block}: test delle 4 giornate, conferma finale e tutte le 15 settimane.</div><br><button class="btn" onclick="selected.block=${Math.max(0,prev)};selected.week=1;selected.day=1;selected.exercise=0;program()">Vai al Blocco precedente</button></div>`;return;
 }
 if(!ensureBlockTest(selected.block)){
   const st=DB.tests&&DB.tests[selected.block+1];
   document.getElementById('app').innerHTML=`<div class="hero"><h1>${esc(b.name)}</h1><div class="muted">Prima di generare il programma devi completare i test del blocco, suddivisi nelle 4 giornate.</div><br><button class="btn" onclick="gymlogicTest(${selected.block+1})">Imposta massimali · 4 giornate</button></div>`;return;
 }
 document.getElementById('app').innerHTML=`<div class="hero"><h1>Programma annuale</h1><div class="muted">Ordine fisso: 1 Forza Ipertrofica → 2 Trasformazione Ipertrofica → 3 Qualità Muscolare.</div></div><div class="toolbar"><div class="card" style="margin:0"><b>Blocco ${selected.block+1}</b><div class="muted tiny" style="margin-top:4px">${esc(b.name)}</div></div><select class="select" onchange="selected.week=+this.value;selected.day=1;selected.exercise=0;program()">${b.weeks.map(w=>`<option value="${w.week}" ${w.week===selected.week?'selected':''}>Settimana ${w.week} · ${esc(w.phase)}</option>`).join('')}</select></div><div class="card"><b>Blocco generato · 15 settimane</b><div class="muted tiny" style="margin-top:5px">I valori dei test sono bloccati fino al completamento del blocco.</div></div><div class="sectionTitle">${esc(w.phase)} · Settimana ${w.week}</div>${w.days.map(x=>{const gd=isDayDone(selected.block,w.week,x.day);return `<button class="listbtn ${gd?'day-done':''}" onclick="selected.day=${x.day};selected.exercise=0;render('workout')"><span class="row"><span><b>Giorno ${x.day}</b><small>${x.exercises.length} esercizi</small></span>${gd?'<span class="day-check">✓</span>':''}</span></button>`}).join('')}`
}


function workout(){if(!ensureBlockTest(selected.block)){program();return}let d=day(),e=getEx(d,selected.exercise),b=selected.block,w=selected.week,dy=selected.day;let done=completedSets(b,w,dy,selected.exercise);let pct=Math.round(done.length/Math.max(1,Number(e.sets))*100);let load=loadFor(e);document.getElementById('app').innerHTML=`<div class="row"><div><h1 style="margin:5px 0">Giorno ${dy}</h1><div class="muted tiny">Blocco ${b+1} · ${esc(week().phase)} · Settimana ${w}</div></div><button class="btn secondary" onclick="program()">Programma</button></div><div class="sectionTitle">${esc(e.exercise)}</div><div class="exercise"><h3>${esc(e.exercise)}</h3><div class="meta"><span>${esc(e.sets)} serie</span><span>${esc(e.reps)} reps</span>${e.plannedLoad?`<span>Carico: ${esc(e.plannedLoad)}${e.percent?' · '+esc(e.percent):''}</span>`:''}<span>Recupero: ${esc(e.rest)}</span>${e.tempo?`<span>Tempo: ${esc(e.tempo)}</span>`:''}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="sets">${Array.from({length:Number(e.sets)||1},(_,i)=>`<button class="set ${done.includes(i)?'done':''}" onclick="toggleSet(${b},${w},${dy},${selected.exercise},${i})">${i+1}</button>`).join('')}</div>${e.notes?`<div class="note">${esc(e.notes)}</div>`:''}<div class="loadbox"><input id="load" inputmode="decimal" placeholder="Carico usato una sola volta" value="${esc(load??'')}"><button class="btn" ${done.length<(Number(e.sets)||1)?'disabled style="opacity:.45"':''} onclick="saveLoad()">Salva carico e continua</button></div><div class="tiny muted" style="margin-top:7px">Il carico usato si inserisce una sola volta, dopo aver completato tutte le serie.</div></div><div class="row"><button class="btn secondary" onclick="prevEx()">← Precedente</button><button class="btn" onclick="nextEx()">${selected.exercise===d.exercises.length-1?'Completa giorno':'Avanti →'}</button></div>`}
function toggleSet(b,w,d,i,s){let k=keyFor(b,w,d,i),a=DB.completed[k]||[];if(a.includes(s))a=a.filter(x=>x!==s);else a=[...a,s].sort((x,y)=>x-y);DB.completed[k]=a;const total=Number(PROGRAM[b].weeks.find(x=>x.week==w).days.find(x=>x.day==d).exercises[i].sets)||1;let next=0;while(next<total&&a.includes(next))next++;DB.bookmark={block:b,week:w,day:d,exercise:i,set:Math.min(next,total-1)};save();workout()}
function saveLoad(){let e=getEx(day(),selected.exercise),done=completedSets(selected.block,selected.week,selected.day,selected.exercise),v=document.getElementById('load').value.trim();if(done.length<(Number(e.sets)||1)){alert('Completa prima tutte le serie.');return}if(!v){alert('Inserisci il carico usato.');return}if(v){DB.loads[e.exercise]=v;DB.history.push({date:new Date().toISOString(),block:selected.block+1,week:selected.week,day:selected.day,exercise:e.exercise,load:v});}save();nextEx()}
function nextEx(){let d=day();if(selected.exercise<d.exercises.length-1){selected.exercise++;DB.bookmark={block:selected.block,week:selected.week,day:selected.day,exercise:selected.exercise,set:0};save();workout()}else{const finishedDay=isDayDone(selected.block,selected.week,selected.day);if(finishedDay&&selected.week===15&&selected.day===4){DB.blocksCompleted[selected.block]=true;}DB.bookmark=null;save();document.getElementById('app').innerHTML=`<div class="hero"><div class="day-check" style="width:56px;height:56px;font-size:30px;margin-bottom:12px">✓</div><h1>Allenamento completato</h1><div class="muted">Giorno ${selected.day}, settimana ${selected.week} completato.</div>${selected.week===15&&selected.day===4?'<br><div class="muted"><b>Blocco '+(selected.block+1)+' completato.</b> Il blocco successivo sarà disponibile quando previsto dall’ordine del programma.</div>':''}<br><button class="btn" onclick="program()">Torna al programma</button></div>`}}
function prevEx(){if(selected.exercise>0){selected.exercise--;workout()}}
function profile(){let u=getUsers()[currentUser()]||{};document.getElementById('app').innerHTML=`<div class="hero"><h1>Profilo</h1><div class="muted">${esc(u.name||currentUser()||'')} · GymLogic Premium</div></div><div class="card"><b>Premium</b><p class="muted">Mensile €9,99 · Trimestrale €24,99 · Semestrale €44,99 · Annuale €69,99</p><button class="btn">Scopri Premium</button></div><div class="card"><b>Porta un amico</b><p class="muted">Sconto 10% previsto per il referral.</p><button class="btn secondary">Condividi GymLogic</button></div><div class="card"><b>Dati locali</b><p class="muted">Progressi e segnalibro sono salvati sul dispositivo.</p><button class="btn ghost" onclick="if(confirm('Azzerare tutti i dati locali?')){localStorage.removeItem(KEY);location.reload()}">Azzera dati</button><button class="btn secondary" onclick="clearSession();location.reload()">Esci dall'account</button></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.tab));
fetch('program.json').then(r=>r.json()).then(x=>{PROGRAM=x;if(requireAuth())render('home')}).catch(()=>document.getElementById('app').innerHTML='<div class="empty">Impossibile caricare il programma. Verifica che program.json sia nella stessa cartella di index.html.</div>');
</script><script>
(function(){
window.gymlogicTest=function(block){
 let bi=Number(block)-1;if(!PROGRAM[bi])return;
 let b=PROGRAM[bi], week1=(b.weeks||[]).find(w=>Number(w.week)===1); if(!week1)return;
 if(!DB.tests[block])DB.tests[block]={days:{1:{confirmed:false},2:{confirmed:false},3:{confirmed:false},4:{confirmed:false}},byName:{}};
 let state=DB.tests[block]; state.days=state.days||{1:{confirmed:false},2:{confirmed:false},3:{confirmed:false},4:{confirmed:false}}; state.byName=state.byName||{};
 if(state.__complete){render('program');return;}
 function matchMass(name){
   let arr=b.massimali||[],n=normName(name);
   let x=arr.find(x=>normName(x.exercise)===n);if(x)return x;
   return arr.find(x=>{let a=normName(x.exercise);return a.includes(n)||n.includes(a)})||null;
 }
 function locateMass(m){
   let mn=normName(m.exercise);
   for(const d of week1.days){for(const e of d.exercises){let n=normName(e.exercise);if(n===mn||n.includes(mn)||mn.includes(n))return Number(d.day)}}
   // If a massimale is not present in week 1, locate its first appearance in the block.
   for(const w of b.weeks){for(const d of w.days){for(const e of d.exercises){let n=normName(e.exercise);if(n===mn||n.includes(mn)||mn.includes(n))return Number(d.day)}}}
   return 1;
 }
 // One test card per massimale, assigned to the real first occurrence among the 4 test days.
 let byDay={1:[],2:[],3:[],4:[]};
 (b.massimali||[]).forEach((m,mi)=>{let day=locateMass(m);if(!byDay[day])byDay[day]=[];byDay[day].push({id:String(mi),name:m.exercise,entry:m,spec:testSpecFromEntry(block,m.exercise)});});
 let aliases={};
 function rememberName(item){let n=normName(item.name);aliases[n]=item.id;}
 Object.values(byDay).flat().forEach(rememberName);
 // Also make each exercise name that maps to a combined test inherit that test value.
 function linkedId(name){let n=normName(name);if(aliases[n])return aliases[n];let x=Object.values(byDay).flat().find(it=>{let a=normName(it.name);return a.includes(n)||n.includes(a)});return x?x.id:null;}
 let all=Object.values(byDay).flat();
 let currentDay=([1,2,3,4].find(d=>!state.days[d].confirmed)||4);
 let dayItems=byDay[currentDay]||[];
 // skip already entered values
 let pending=dayItems.findIndex(it=>!isFinite(Number(state[it.id])));
 if(pending<0){
   if(!state.days[currentDay].confirmed){
     let o=document.createElement('div');o.id='glo';o.innerHTML=`<div class="glcard glsingle"><div class="gltop"><small>GYMLOGIC · BLOCCO ${block}</small><span>GIORNO ${currentDay} / 4</span></div><div class="glstep">GIORNATA ${currentDay} COMPLETATA</div><h1>Conferma Giorno ${currentDay}</h1><p>Hai inserito tutti i test previsti per questa giornata. Conferma per bloccare definitivamente i risultati e passare alla giornata successiva.</p><div class="glrule">I valori confermati <b>non potranno essere modificati</b> fino al completamento dell'intero blocco.</div><button id="gconfirm">Conferma Giorno ${currentDay}</button></div>`;document.body.appendChild(o);o.querySelector('#gconfirm').onclick=()=>{state.days[currentDay].confirmed=true;save();o.remove();setTimeout(()=>window.gymlogicTest(block),0)};return;
   }
 }
 if([1,2,3,4].every(d=>state.days[d].confirmed)){
   state.__complete=true;state.programGenerated=true;state.generatedAt=new Date().toISOString();save();
   let o=document.createElement('div');o.id='glo';o.innerHTML=`<div class="glcard glsingle"><div class="glstep">✓ 4 / 4 GIORNATE CONFERMATE</div><h1>Blocco ${block} pronto</h1><p>Ora GymLogic utilizzerà i test confermati per impostare i carichi e rendere disponibile il programma completo di <b>15 settimane</b>.</p><div class="glrule"><b>${esc(b.name)}</b><br>Il programma rimane fisso e i test del blocco restano bloccati.</div><button id="ggen">Genera programma · 15 settimane</button></div>`;document.body.appendChild(o);o.querySelector('#ggen').onclick=()=>{o.remove();selected={block:bi,week:1,day:1,exercise:0};render('program')};return;
 }
 let item=dayItems[pending]; if(!item){setTimeout(()=>window.gymlogicTest(block),0);return;}
 let totalDay=dayItems.length, doneDay=pending, confirmed=[1,2,3,4].filter(d=>state.days[d].confirmed).length;
 let o=document.createElement('div');o.id='glo';o.innerHTML=`<div class="glcard glsingle"><div class="gltop"><small>GYMLOGIC · BLOCCO ${block}</small><span>GIORNO ${currentDay} / 4</span></div><div class="glbar"><i style="width:${Math.round(doneDay/Math.max(1,totalDay)*100)}%"></i></div><div class="gllegend"><span>Giorni confermati: ${confirmed}/4</span><span>Test giornata: ${doneDay+1}/${totalDay}</span></div><h1>${esc(item.name)}</h1><span class="glbadge">${esc(item.spec.kind)}</span><p>${esc(item.spec.instruction)}</p><div class="glrule">Il risultato viene salvato subito. Dopo la conferma della giornata non potrà essere modificato fino al completamento del blocco.</div><div class="glinput big"><input id="gval" inputmode="decimal" autocomplete="off" placeholder="Inserisci kg"><em>kg</em></div><button id="gbs">Conferma test</button></div>`;document.body.appendChild(o);
 let inp=o.querySelector('#gval');inp.focus();o.querySelector('#gbs').onclick=()=>{let v=parseFloat(String(inp.value).replace(',','.'));if(!isFinite(v)||v<=0){alert('Inserisci un carico valido in kg.');return;}state[item.id]=v;state.byName[normName(item.name)]=v;save();o.remove();setTimeout(()=>window.gymlogicTest(block),0)};
};
window.GymLogicLoadFromMax=(block,exercise,pct)=>{let max=testKg(block,exercise);pct=parseFloat(String(pct).replace('%','').replace(',','.'));return isFinite(max)&&isFinite(pct)?Math.round(max*pct/100*2)/2:''};
let st=document.createElement('style');st.textContent=`#glo{position:fixed;inset:0;z-index:99999;background:rgba(5,7,9,.98);display:grid;place-items:center;padding:14px}.glcard{width:min(760px,100%);max-height:94vh;overflow:hidden;background:#12161b;border:1px solid #2c353d;border-radius:28px;padding:24px;box-shadow:0 30px 100px #000b;display:flex;flex-direction:column}.gltop{display:flex;justify-content:space-between;gap:12px;align-items:center}.gltop span{font-size:12px;opacity:.6}.glcard small{letter-spacing:.04em;opacity:.7}.glcard h1{font-size:32px;margin:10px 0}.glcard p{opacity:.72;line-height:1.5}.gllegend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}.gllegend span{padding:8px 10px;border-radius:10px;background:#1b2127;font-size:12px}.glscroll{overflow:auto;min-height:0;padding-right:3px}.gltestrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #252b31}.gltestinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.gltestinfo b{font-size:14px}.gltestinfo small{font-size:12px;line-height:1.35}.glbadge{width:max-content;padding:4px 8px;border-radius:999px;background:#b9f23b22;color:#b9f23b;font-size:11px;font-weight:900}.glinput{display:flex;align-items:center;gap:6px}.glinput input{width:100px;padding:11px;border-radius:12px;border:1px solid #3b454e;background:#0d1013;color:white;font-size:16px}.glinput em{font-style:normal;font-size:12px;opacity:.6}.glcard button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:15px;background:#b9f23b;color:#10150b;font-weight:900}.glsingle{max-width:560px}.glstep{font-size:11px;font-weight:900;letter-spacing:.12em;opacity:.55;margin-top:18px}.glbar{height:6px;background:#20262c;border-radius:99px;overflow:hidden;margin-top:12px}.glbar i{display:block;height:100%;background:#b9f23b}.glrule{background:#1b2127;border:1px solid #2b333b;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.45;color:#c7ced5;margin:14px 0}.glinput.big input{width:100%;font-size:20px;padding:14px}`;document.head.appendChild(st);
})();</script></body></html>
