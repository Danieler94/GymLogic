<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><title>GymLogic — Smart Training</title><style>

r(--line);padding:14px;border-radius:14px;margin:5px 0}.listbtn small{display:block;color:var(--muted);margin-top:4px}.select{width:100%;background:#111827;color:#fff;border:1px solid var(--line);padding:12px;border-radius:12px}.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0}.exercise.done{border-color:rgba(33,199,122,.55)}.exercise h3{margin:0 0 8px;font-size:17px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.meta span{background:#1a2335;border-radius:8px;padding:6px 8px;font-size:12px}.sets{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.set{width:42px;height:42px;border-radius:12px;background:#222b3e;color:#fff;font-weight:800}.set.done{background:var(--ok)}.loadbox{display:flex;gap:8px;margin-top:12px}.loadbox input{min-width:0;flex:1;background:#0c1220;color:#fff;border:1px solid var(--line);border-radius:11px;padding:11px}.note{background:#0d1423;border-left:3px solid var(--accent);padding:10px 11px;border-radius:8px;color:#c7cfdd;font-size:13px;line-height:1.4;margin-top:9px}.sectionTitle{font-size:18px;font-weight:800;margin:18px 0 9px}.progress{height:7px;background:#1c2637;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editor label{display:block;color:var(--muted);font-size:11px;margin:9px 0 4px}.editor input,.editor textarea{width:100%;background:#0c1220;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.editor textarea{min-height:80px;resize:vertical}.tag{color:#cfc7ff}.empty{text-align:center;padding:35px 10px;color:var(--muted)}
</style>
<style id="gymlogic-premium-ui">
:root{

body{

p,.muted,.subtitle,.small{color:var(--gl-muted)!important}

}

.gl-brand{

  padding:12px 16px;background:rgba(7,9,13,.78);backdrop-filter:blur(18px);

}
.gl-logo{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--gl-accent);color:#0a0d08;font-weight:950;box-shadow:0 8px 24px rgba(184,255,61,.18)
}
.gl-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--gl-accent);font-weight:800}
.gl-section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:28px 0 14px}
.gl-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gl-stat{padding:18px;border:1px solid var(--gl-line);border-radius:18px;background:#10141b}
.gl-stat strong{display:block;font-size:27px;letter-spacing:-.05em}
.gl-stat span{display:block;color:var(--gl-muted);font-size:12px;margin-top:5px}

}

.gl-exercise .num{

}

.gl-load{font-weight:800;color:var(--gl-accent2)}
.gl-bottom{
  position:sticky;bottom:12px;z-index:20;margin-top:18px;padding:10px;
  background:rgba(10,13,18,.84);border:1px solid rgba(255,255,255,.08);border-radius:20px;
  backdrop-filter:blur(18px);box-shadow:0 15px 45px rgba(0,0,0,.35)
}
@media(max-width:650px){
  main,.container,.content{padding-left:15px!important;padding-right:15px!important}

</head><body><div class="gl-brand" id="glPremiumBrand"><span class="gl-logo">G</span><span>GYMLOGIC</span></div><div class="app"><header class="top"><div class="brand">GymLogic</div><div class="sub">2.3 · PROGRAMMA ANNUALE · WORD BASE</div></header><main id="app" class="content"></main><nav class="nav"><button data-tab="home"><b>⌂</b>Home</button><button data-tab="program"><b>▦</b>Programma</button><button data-tab="workout"><b>▶</b>Workout</button><button data-tab="editor"><b>✎</b>Modifica</button><button data-tab="profile"><b>◎</b>Profilo</button></nav></div><script>
const KEY='gymlogic23';let DB={bookmark:null,loads:{},completed:{},history:[],overrides:{}};try{DB={...DB,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
let PROGRAM=[];let selected={block:0,week:1,day:1,exercise:0};
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function block(){return PROGRAM[selected.block]} function week(){return block().weeks.find(w=>w.week==selected.week)} function day(){return week().days.find(d=>d.day==selected.day)}
function allDays(){return PROGRAM.flatMap(b=>b.weeks.flatMap(w=>w.days))}
function totalExercises(){return allDays().reduce((n,d)=>n+d.exercises.length,0)}
function getEx(d,i){let e=d.exercises[i];let k=`${selected.block}-${selected.week}-${selected.day}-${i}`;return {...e,...(DB.overrides[k]||{}),_key:k}}
function loadFor(e){return DB.loads[e.exercise]??null}
function keyFor(b,w,d,i){return `${b}-${w}-${d}-${i}`}
function completedSets(b,w,d,i){return DB.completed[keyFor(b,w,d,i)]||[]}
function isExerciseDone(b,w,d,i){let e=PROGRAM[b].weeks.find(x=>x.week==w).days.find(x=>x.day==d).exercises[i];return completedSets(b,w,d,i).length>=Number(e.sets||0)}
function setTab(t){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render(t)}
function render(t='home'){if(!PROGRAM.length)return;setTabActive(t);if(t==='home')home();else if(t==='program')program();else if(t==='workout')workout();else if(t==='editor')editor();else profile()}
function setTabActive(t){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t))}
function home(){let b=DB.bookmark;let text=b?`Blocco ${b.block+1} · Settimana ${b.week} · Giorno ${b.day} · Esercizio ${b.exercise+1} · Serie ${b.set+1}`:'Nessun allenamento in corso';let done=DB.history.length;document.getElementById('app').innerHTML=`<section class="hero"><h1>${b?'Continua da dove hai lasciato':'Inizia il tuo percorso'}</h1><div class="muted">${text}</div><br><button class="btn" onclick="${b?'resume()':'startCurrent()'}">${b?'Continua allenamento':'Apri programma'}</button></section><div class="grid"><div class="card stat"><span class="muted tiny">Allenamenti registrati</span><strong>${done}</strong></div><div class="card stat"><span class="muted tiny">Esercizi nel programma</span><strong>${totalExercises()}</strong></div></div><div class="sectionTitle">Percorso annuale</div>${PROGRAM.map((x,i)=>`<div class="card"><div class="row"><div><b>Blocco ${i+1}</b><div class="muted tiny">${esc(x.name)}</div></div><span class="pill">15 settimane</span></div></div>`).join('')}`}
function startCurrent(){selected={block:0,week:1,day:1,exercise:0};render('program')}
function resume(){let b=DB.bookmark;selected={block:b.block,week:b.week,day:b.day,exercise:b.exercise};render('workout')}
function program(){let b=block(),w=week(),d=day();document.getElementById('app').innerHTML=`<div class="hero"><h1>Programma annuale</h1><div class="muted">Un solo percorso annuale composto da 3 blocchi · 15 settimane per blocco.</div></div><div class="toolbar"><select class="select" onchange="selected.block=+this.value;selected.week=1;selected.day=1;selected.exercise=0;program()">${PROGRAM.map((x,i)=>`<option value="${i}" ${i===selected.block?'selected':''}>Blocco ${i+1} · ${esc(x.name)}</option>`).join('')}</select><select class="select" onchange="selected.week=+this.value;selected.day=1;selected.exercise=0;program()">${b.weeks.map(w=>`<option value="${w.week}" ${w.week===selected.week?'selected':''}>Settimana ${w.week} · ${esc(w.phase)}</option>`).join('')}</select></div><div class="sectionTitle">${esc(w.phase)} · Settimana ${w.week}</div>${w.days.map(x=>`<button class="listbtn" onclick="selected.day=${x.day};selected.exercise=0;render('workout')"><b>Giorno ${x.day}</b><small>${x.exercises.length} esercizi</small></button>`).join('')}`}
function workout(){let d=day(),e=getEx(d,selected.exercise),b=selected.block,w=selected.week,dy=selected.day;let done=completedSets(b,w,dy,selected.exercise);let pct=Math.round(done.length/Math.max(1,Number(e.sets))*100);let load=loadFor(e);document.getElementById('app').innerHTML=`<div class="row"><div><h1 style="margin:5px 0">Giorno ${dy}</h1><div class="muted tiny">Blocco ${b+1} · ${esc(week().phase)} · Settimana ${w}</div></div><button class="btn secondary" onclick="program()">Programma</button></div><div class="sectionTitle">${esc(e.exercise)}</div><div class="exercise"><h3>${esc(e.exercise)}</h3><div class="meta"><span>${esc(e.sets)} serie</span><span>${esc(e.reps)} reps</span>${e.plannedLoad?`<span>Carico: ${esc(e.plannedLoad)}${e.percent?' · '+esc(e.percent):''}</span>`:''}<span>Recupero: ${esc(e.rest)}</span>${e.tempo?`<span>Tempo: ${esc(e.tempo)}</span>`:''}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="sets">${Array.from({length:Number(e.sets)||1},(_,i)=>`<button class="set ${done.includes(i)?'done':''}" onclick="toggleSet(${b},${w},${dy},${selected.exercise},${i})">${i+1}</button>`).join('')}</div>${e.notes?`<div class="note">${esc(e.notes)}</div>`:''}<div class="loadbox"><input id="load" inputmode="decimal" placeholder="Carico usato una sola volta" value="${esc(load??'')}"><button class="btn" ${done.length<(Number(e.sets)||1)?'disabled style="opacity:.45"':''} onclick="saveLoad()">Salva carico e continua</button></div><div class="tiny muted" style="margin-top:7px">Il carico usato si inserisce una sola volta, dopo aver completato tutte le serie.</div></div><div class="row"><button class="btn secondary" onclick="prevEx()">← Precedente</button><button class="btn" onclick="nextEx()">${selected.exercise===d.exercises.length-1?'Completa giorno':'Avanti →'}</button></div>`}
function toggleSet(b,w,d,i,s){let k=keyFor(b,w,d,i),a=DB.completed[k]||[];if(a.includes(s))a=a.filter(x=>x!==s);else a=[...a,s].sort((x,y)=>x-y);DB.completed[k]=a;const total=Number(PROGRAM[b].weeks.find(x=>x.week==w).days.find(x=>x.day==d).exercises[i].sets)||1;let next=0;while(next<total&&a.includes(next))next++;DB.bookmark={block:b,week:w,day:d,exercise:i,set:Math.min(next,total-1)};save();workout()}
function saveLoad(){let e=getEx(day(),selected.exercise),done=completedSets(selected.block,selected.week,selected.day,selected.exercise),v=document.getElementById('load').value.trim();if(done.length<(Number(e.sets)||1)){alert('Completa prima tutte le serie.');return}if(!v){alert('Inserisci il carico usato.');return}if(v){DB.loads[e.exercise]=v;DB.history.push({date:new Date().toISOString(),block:selected.block+1,week:selected.week,day:selected.day,exercise:e.exercise,load:v});}save();nextEx()}
function nextEx(){let d=day();if(selected.exercise<d.exercises.length-1){selected.exercise++;DB.bookmark={block:selected.block,week:selected.week,day:selected.day,exercise:selected.exercise,set:0};save();workout()}else{DB.bookmark=null;save();document.getElementById('app').innerHTML=`<div class="hero"><h1>Allenamento completato ✓</h1><div class="muted">Giorno ${selected.day}, settimana ${selected.week} registrato.</div><br><button class="btn" onclick="program()">Torna al programma</button></div>`}}
function prevEx(){if(selected.exercise>0){selected.exercise--;workout()}}
function editor(){let b=block(),w=week(),d=day(),i=Math.min(selected.exercise,d.exercises.length-1),e=getEx(d,i);document.getElementById('app').innerHTML=`<div class="hero"><h1>Modifica programma</h1><div class="muted">Base importata dai 3 Word. Qui modifichi la scheda senza perdere la struttura originale.</div></div><select class="select" onchange="selected.block=+this.value;selected.week=1;selected.day=1;selected.exercise=0;editor()">${PROGRAM.map((x,j)=>`<option value="${j}" ${j===selected.block?'selected':''}>Blocco ${j+1} · ${esc(x.name)}</option>`).join('')}</select><br><br><div class="toolbar"><select class="select" onchange="selected.week=+this.value;selected.day=1;selected.exercise=0;editor()">${b.weeks.map(x=>`<option value="${x.week}" ${x.week===selected.week?'selected':''}>Settimana ${x.week}</option>`).join('')}</select><select class="select" onchange="selected.day=+this.value;selected.exercise=0;editor()">${w.days.map(x=>`<option value="${x.day}" ${x.day===selected.day?'selected':''}>Giorno ${x.day}</option>`).join('')}</select></div><div class="sectionTitle">Esercizio</div>${d.exercises.map((x,j)=>`<button class="listbtn" onclick="selected.exercise=${j};editor()" ${j===i?'style="border-color:var(--accent)"':''}><b>${esc(x.exercise)}</b><small>${x.sets} × ${esc(x.reps)} · ${x.plannedLoad||'carico libero'} · ${x.rest}</small></button>`).join('')}<div class="card editor"><label>Esercizio</label><input id="edName" value="${esc(e.exercise)}"><label>Serie</label><input id="edSets" value="${esc(e.sets)}"><label>Reps</label><input id="edReps" value="${esc(e.reps)}"><label>Carico previsto</label><input id="edLoad" value="${esc(e.plannedLoad||'')}"><label>Percentuale</label><input id="edPct" value="${esc(e.percent||'')}"><label>Recupero</label><input id="edRest" value="${esc(e.rest)}"><label>Tempo / TUT</label><input id="edTempo" value="${esc(e.tempo||'')}"><label>Note / tecnica</label><textarea id="edNotes">${esc(e.notes||'')}</textarea><br><button class="btn" onclick="saveEdit()">Salva modifica</button></div>`}
function saveEdit(){let k=`${selected.block}-${selected.week}-${selected.day}-${selected.exercise}`;DB.overrides[k]={exercise:document.getElementById('edName').value,sets:document.getElementById('edSets').value,reps:document.getElementById('edReps').value,plannedLoad:document.getElementById('edLoad').value||null,percent:document.getElementById('edPct').value||null,rest:document.getElementById('edRest').value,tempo:document.getElementById('edTempo').value||null,notes:document.getElementById('edNotes').value};save();editor()}
function profile(){document.getElementById('app').innerHTML=`<div class="hero"><h1>Profilo</h1><div class="muted">GymLogic Premium</div></div><div class="card"><b>Premium</b><p class="muted">Mensile €9,99 · Trimestrale €24,99 · Semestrale €44,99 · Annuale €69,99</p><button class="btn">Scopri Premium</button></div><div class="card"><b>Porta un amico</b><p class="muted">Sconto 10% previsto per il referral.</p><button class="btn secondary">Condividi GymLogic</button></div><div class="card"><b>Dati locali</b><p class="muted">Progressi e segnalibro sono salvati sul dispositivo.</p><button class="btn ghost" onclick="if(confirm('Azzerare tutti i dati locali?')){localStorage.removeItem(KEY);location.reload()}">Azzera dati</button></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.tab));
fetch('program.json').then(r=>r.json()).then(x=>{PROGRAM=x;render('home')}).catch(()=>document.getElementById('app').innerHTML='<div class="empty">Impossibile caricare il programma. Verifica che program.json sia nella stessa cartella di index.html.</div>');
</script></body></html>
